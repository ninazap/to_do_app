services:
  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: todo_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_password}
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo_user} -d ${POSTGRES_DB:-todo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo_network

  # Среда разработки Python
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_app
    volumes:
      - .:/app
      - poetry_cache:/root/.cache/pypoetry
    working_dir: /app
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-todo_user}:${POSTGRES_PASSWORD:-todo_password}@db:5432/${POSTGRES_DB:-todo_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-todo_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-todo_password}
      - POSTGRES_DB=${POSTGRES_DB:-todo_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo_network

volumes:
  postgres_data:
  poetry_cache:

networks:
  todo_network:
    driver: bridge