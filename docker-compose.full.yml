# docker-compose.full.yml (УДАЛИТЬ ПЕРВУЮ СТРОКУ 'version: '3.8'')
services:  # ← НАЧИНАЕТСЯ С ЭТОЙ СТРОКИ!
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - todo_network
    command: redis-server --appendonly yes

  db:
    image: postgres:15-alpine
    container_name: todo_db
    environment:
      POSTGRES_USER: ${TODO_DB_USER}
      POSTGRES_PASSWORD: ${TODO_DB_PASSWORD}
      POSTGRES_DB: ${TODO_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TODO_DB_USER} -d ${TODO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo_network

  auth_db:
    image: postgres:15-alpine
    container_name: auth_db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo_network

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: todo_app
    volumes:
      - ./app:/app
      - poetry_cache:/root/.cache/pypoetry
    working_dir: /app
    command:
      - /bin/sh
      - -c
      - |
        alembic upgrade head &&
        poetry run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${TODO_DB_USER}:${TODO_DB_PASSWORD}@db:5432/${TODO_DB_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: 0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      CORS_ORIGINS: http://localhost:8001,http://localhost:5173
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - todo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth_app:
    build:
      context: ./auth_pro
      dockerfile: Dockerfile
    container_name: auth_app
    volumes:
      - ./auth_pro:/app
    working_dir: /app
    command: 
      - /bin/sh
      - -c
      - |
        poetry run uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth_db:5432/${AUTH_DB_NAME}
      DB_HOST: auth_db
      DB_PORT: 5432
      DB_USER: ${AUTH_DB_USER}
      DB_PASS: ${AUTH_DB_PASSWORD}
      DB_NAME: ${AUTH_DB_NAME}
      TODO_DB_URL: postgresql://${TODO_DB_USER}:${TODO_DB_PASSWORD}@db:5432/${TODO_DB_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: 1
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:8000,http://localhost:5173
      TODO_SERVICE_URL: http://app:8000
    depends_on:
      auth_db:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - todo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  auth_postgres_data:
  poetry_cache:

networks:
  todo_network:
    driver: bridge